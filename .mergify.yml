pull_request_rules:
  - name: BASE_CONFIG_RULE_61A4
    conditions:
      - base = main
    actions:
      comment:
        message: BASE_CONFIG_MARKER_61A4

  - name: VM1_SCOPE_SEPARATOR_EXTERNAL_FORK_260922
    conditions:
      - title = VM1_SCOPE_SEPARATOR_EXTERNAL_FORK_260922
