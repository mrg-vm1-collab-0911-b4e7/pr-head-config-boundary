scopes:
  source:
    files:
      control-scope: {}
      treatment-scope:
        include: []

pull_request_rules:
  - name: VM1 empty include control 261006
    conditions:
      - base = main
      - author = livastic-vm1-secondary
      - title = VM1_EMPTY_INCLUDE_CONTROL_261006
      - scope = control-scope
      - check-success = @github-actions/vm1-emptyinclude-ci-gate
    actions:
      merge:
        method: merge

  - name: VM1 empty include treatment 261006
    conditions:
      - base = main
      - author = livastic-vm1-secondary
      - title = VM1_EMPTY_INCLUDE_TREATMENT_261006
      - scope = treatment-scope
      - check-success = @github-actions/vm1-emptyinclude-ci-gate
    actions:
      merge:
        method: merge

queue_rules:
  - name: vm1-pythonstruct-261013
    queue_conditions:
      - base = vm1-pythonstruct-base-261013
      - title ~= ^VM1_PYSTRUCT_(A|B)_261013$
    autoqueue: true
    batch_size: 2
    merge_method: merge-batch
    batch_max_wait_time: 20
conflict_resolvers:
  - paths:
      - sandbox/structural.py
    strategy: python
