name: VM1 Scope Separator Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  scope-detect-default:
    runs-on: ubuntu-latest
    outputs:
      scopes: ${{ steps.mergify-scopes.outputs.scopes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect scopes with official v25 default
        id: mergify-scopes
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: scopes

  scope-detect-fixed:
    runs-on: ubuntu-latest
    outputs:
      scopes: ${{ steps.mergify-scopes.outputs.scopes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect scopes with fixed CLI
        id: mergify-scopes
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: scopes
          mergify_cli_version: 2026.8.7.1

  sensitive-test:
    needs: scope-detect-default
    if: ${{ fromJSON(needs.scope-detect-default.outputs.scopes).backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Controlled required guard
        run: |
          echo "VM1_SCOPE_SEPARATOR_REQUIRED_GUARD_EXECUTED"
          exit 1

  fixed-control:
    needs: scope-detect-fixed
    if: ${{ fromJSON(needs.scope-detect-fixed.outputs.scopes).backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fixed version sees backend scope
        run: echo "VM1_SCOPE_SEPARATOR_FIXED_DETECTED_BACKEND"
