name: VM1 release tag expression canary
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Direct expression interpolation canary
        shell: bash
        run: |
          set -euo pipefail
          rm -f README.md
          tag="${{ github.event.release.tag_name }}"
          test -f README.md
          echo "VM1_DIRECT_TAG_INJECTION=$(cat README.md)"
          rm -f README.md
      - name: GITHUB_REF sed-program canary
        shell: bash
        run: |
          set -euo pipefail
          printf '[project]\nname = "vm1"\nversion = "0.0.0"\n' > pyproject.toml
          VERSION="${GITHUB_REF#refs/tags/}"
          sed -i.bak -E "s/^version = \".*\"$/version = \"${VERSION}\"/" pyproject.toml
          test -f README.md
          grep -qx 'VM1_RELEASE_TAG_CANARY' README.md
          grep -qx 'version = "2026.9.99.1"' pyproject.toml
          echo "VM1_SED_TAG_INJECTION=$(cat README.md)"
          echo "VM1_GITHUB_REF=$GITHUB_REF"

