name: VM1 Hex Branch Scope Gate 261008

on:
  pull_request:

jobs:
  detect-scopes:
    runs-on: ubuntu-24.04
    outputs:
      scopes: ${{ steps.scopes.outputs.scopes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: scopes
        uses: Mergifyio/gha-mergify-ci@v26
        with:
          action: scopes
          base: ${{ github.base_ref }}
          mergify_cli_version: 2026.10.3

  critical-security:
    needs: detect-scopes
    if: ${{ fromJSON(needs.detect-scopes.outputs.scopes)['critical'] == true }}
    runs-on: ubuntu-24.04
    steps:
      - name: Controlled critical gate
        run: exit 41

  aggregate:
    name: vm1-hex-branch-gate
    if: ${{ always() }}
    needs:
      - detect-scopes
      - critical-security
    runs-on: ubuntu-24.04
    steps:
      - name: Require detector success and no critical-scope failure
        env:
          DETECT: ${{ needs.detect-scopes.result }}
          CRITICAL: ${{ needs.critical-security.result }}
        run: |
          printf 'detect=%s critical=%s\n' "$DETECT" "$CRITICAL"
          test "$DETECT" = success
          test "$CRITICAL" != failure
